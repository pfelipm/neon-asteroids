<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON ASTEROIDS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05060a; }
  body { font-family:'Courier New',monospace; }
  canvas { display:block; }
  #game { position:fixed; inset:0; }

  /* ===== HUD ===== */
  #hud {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    color:#5ff7ff; text-shadow:0 0 8px #5ff7ff,0 0 16px #1bf;
    font-size:18px; letter-spacing:2px;
  }
  #scoreLabel { position:absolute; top:14px; left:18px; font-size:11px; opacity:.7; }
  #score { position:absolute; top:28px; left:18px; }
  #levelLabel { position:absolute; top:58px; left:18px; font-size:11px; opacity:.7; }
  #level { position:absolute; top:72px; left:18px; }
  #hsLabel { position:absolute; top:14px; right:18px; font-size:11px; opacity:.7; text-align:right; }
  #hiscore { position:absolute; top:28px; right:18px; text-align:right; }
  #livesWrap { position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:6px; }
  .lifeicon { width:16px; height:18px; }
  #powerupWrap { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
  .pu { font-size:11px; opacity:.9; padding:4px 10px; border:1px solid; border-radius:4px; }
  .pu.shield { color:#5ff7ff; border-color:#5ff7ff; text-shadow:0 0 8px #5ff7ff; }
  .pu.rapid { color:#ff5fd0; border-color:#ff5fd0; text-shadow:0 0 8px #ff5fd0; }
  .pu.spread { color:#7dff6a; border-color:#7dff6a; text-shadow:0 0 8px #7dff6a; }

  /* ===== Welcome / Overlays ===== */
  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:10; overflow:hidden;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(27,70,255,.06), transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(255,27,157,.05), transparent 60%),
      radial-gradient(ellipse at center, rgba(15,20,40,.7), rgba(5,6,10,.97));
  }
  #overlay.hidden { display:none; }
  /* scanlines */
  #overlay::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(95,247,255,.025) 2px, rgba(95,247,255,.025) 4px);
  }
  /* animated glow */
  #overlay::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 35%, rgba(95,247,255,.08), transparent 70%);
    animation: glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%,100% { opacity:.5; transform:scale(1); } 50% { opacity:1; transform:scale(1.1); } }
  @keyframes neonFlicker { 0%,96%,100%{ opacity:1; } 97%{ opacity:.7; } 98%{ opacity:1; } 99%{ opacity:.8; } }
  @keyframes blink { 50%{ opacity:.25; } }
  @keyframes float { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  /* dynamic drift + zoom for decorative shapes */
  @keyframes drift1 {
    0%,100% { transform: translate(0,0) scale(1) rotate(0deg); opacity:.15; }
    25%     { transform: translate(60px,-40px) scale(1.35) rotate(90deg); opacity:.3; }
    50%     { transform: translate(-30px,-90px) scale(0.9) rotate(180deg); opacity:.1; }
    75%     { transform: translate(-70px,-20px) scale(1.2) rotate(270deg); opacity:.28; }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0) scale(1) rotate(45deg); opacity:.15; }
    30%     { transform: translate(-50px,40px) scale(1.5) rotate(135deg); opacity:.3; }
    60%     { transform: translate(40px,80px) scale(0.8) rotate(225deg); opacity:.1; }
  }
  @keyframes drift3 {
    0%,100% { transform: translate(0,0) scale(1); opacity:.15; }
    33%     { transform: translate(80px,50px) scale(1.6); opacity:.32; }
    66%     { transform: translate(-40px,-60px) scale(0.85); opacity:.1; }
  }
  @keyframes drift4 {
    0%,100% { transform: translate(0,0) scale(1) rotate(45deg); opacity:.15; }
    40%     { transform: translate(70px,-50px) scale(1.4) rotate(135deg); opacity:.3; }
    80%     { transform: translate(-50px,30px) scale(0.75) rotate(225deg); opacity:.08; }
  }

  .overlay-inner { position:relative; z-index:1; text-align:center; display:flex; flex-direction:column; align-items:center; }

  /* big title */
  .game-title {
    font-size:clamp(44px, 10vw, 108px);
    font-weight:100;
    letter-spacing:clamp(4px, 1.5vw, 14px);
    line-height:1; margin-bottom:4px;
  }
  .game-title .t-neon {
    color:#5ff7ff;
    text-shadow:0 0 10px #5ff7ff, 0 0 30px #5ff7ff, 0 0 60px #1bf, 0 0 100px #1bf;
    animation: neonFlicker 4s infinite;
  }
  .game-title .t-accent {
    color:#ff5fd0;
    text-shadow:0 0 10px #ff5fd0, 0 0 30px #ff5fd0, 0 0 60px #ff1b9d;
    animation: neonFlicker 3.5s infinite .5s;
  }

  .title-sub {
    color:#9fdfff; font-size:13px; letter-spacing:6px; opacity:.8; margin-top:12px;
    text-shadow:0 0 12px rgba(95,247,255,.5);
  }

  /* settings panel */
  .settings { margin-top:40px; display:flex; gap:48px; pointer-events:auto; }
  .setting-group { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .setting-label {
    font-size:10px; letter-spacing:4px; color:#6a9bcc; opacity:.8;
  }
  .setting-btns { display:flex; gap:8px; }
  .sbtn {
    background:rgba(95,247,255,.04);
    border:1px solid rgba(95,247,255,.18);
    color:#5fb0cc;
    padding:9px 22px;
    font-family:inherit;
    font-size:12px; letter-spacing:3px;
    cursor:pointer; transition:all .18s ease;
    border-radius:2px;
  }
  .sbtn:hover { background:rgba(95,247,255,.12); border-color:rgba(95,247,255,.45); color:#9bf6ff; }
  .sbtn.active {
    background:rgba(95,247,255,.18);
    border-color:#5ff7ff;
    color:#eafdff;
    text-shadow:0 0 8px #5ff7ff;
    box-shadow:0 0 16px rgba(95,247,255,.3), inset 0 0 16px rgba(95,247,255,.08);
  }
  .sbtn.active.diff { border-color:#ffe35f; color:#ffe35f; text-shadow:0 0 8px #ffe35f; box-shadow:0 0 16px rgba(255,227,95,.3), inset 0 0 16px rgba(255,227,95,.08); }

  /* keys */
  .keys { margin-top:40px; font-size:12px; color:#7fa; letter-spacing:2px; line-height:2; opacity:.75; }
  .keys b { color:#ffe35f; text-shadow:0 0 8px #ffe35f; font-weight:normal; }

  .start-prompt {
    margin-top:36px; font-size:18px; letter-spacing:5px; color:#5ff7ff;
    text-shadow:0 0 12px #5ff7ff;
    animation: blink 1.2s steps(2,end) infinite;
  }
  .scoreline { margin-top:18px; font-size:18px; letter-spacing:3px; color:#ff5fd0; text-shadow:0 0 10px #ff5fd0; }
  .scoreline.cyan { color:#5ff7ff; text-shadow:0 0 10px #5ff7ff; }

  /* floating decorative shapes — circles + squares drift and zoom */
  .deco { position:absolute; pointer-events:none; }
  .deco.d1 { top:12%; left:10%; width:60px; height:60px; border:2px solid #5ff7ff; border-radius:50%; box-shadow:0 0 20px #5ff7ff; animation: drift1 11s ease-in-out infinite; }
  .deco.d2 { bottom:14%; right:12%; width:40px; height:40px; border:2px solid #ff5fd0; box-shadow:0 0 20px #ff5fd0; animation: drift2 13s ease-in-out infinite 1.5s; }
  .deco.d3 { top:20%; right:8%; width:24px; height:24px; border:2px solid #ffe35f; border-radius:50%; box-shadow:0 0 15px #ffe35f; animation: drift3 9s ease-in-out infinite .8s; }
  .deco.d4 { bottom:25%; left:8%; width:50px; height:50px; border:2px solid #5ff7ff; box-shadow:0 0 20px #5ff7ff; animation: drift4 12s ease-in-out infinite 2s; }
  /* animated menu background canvas */
  #menuBg { position:fixed; inset:0; z-index:3; pointer-events:none; display:block; }

  /* misc UI */
  #muteBtn {
    position:fixed; bottom:14px; right:14px; pointer-events:auto; cursor:pointer; z-index:6;
    color:#5ff7ff; font-size:11px; letter-spacing:2px; opacity:.6;
    border:1px solid rgba(95,247,255,.3); padding:4px 8px; border-radius:3px;
    background:transparent; font-family:inherit;
  }
  #muteBtn:hover { opacity:1; }
  #renderBadge {
    position:fixed; bottom:14px; left:14px; pointer-events:none; z-index:6;
    font-size:11px; letter-spacing:2px; opacity:.7;
    padding:4px 8px; border-radius:3px; border:1px solid rgba(95,247,255,.3);
  }
  #renderBadge.webgl { color:#5ff7ff; text-shadow:0 0 8px #5ff7ff; }
  #renderBadge.canvas { color:#ffe35f; text-shadow:0 0 8px #ffe35f; border-color:rgba(255,227,95,.4); }
  .pu-easy { color:#5ff7ff; } .pu-normal { color:#ffe35f; } .pu-hard { color:#ff5fd0; }
  /* discreet repo link */
  .repo-link {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:2px; opacity:.45;
    color:#7fa; text-decoration:none; pointer-events:auto;
    transition:opacity .2s ease, color .2s ease;
  }
  .repo-link:hover { opacity:1; color:#9bf6ff; text-shadow:0 0 8px #5ff7ff; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="menuBg"></canvas>

<div id="hud">
  <div id="scoreLabel">SCORE</div>
  <div id="score">000000</div>
  <div id="levelLabel">LEVEL</div>
  <div id="level">01</div>
  <div id="hsLabel">HIGH SCORE</div>
  <div id="hiscore">000000</div>
  <div id="livesWrap"></div>
  <div id="powerupWrap"></div>
</div>

<div id="overlay">
  <div class="deco d1"></div><div class="deco d2"></div><div class="deco d3"></div><div class="deco d4"></div>
  <div class="overlay-inner">
    <h1 class="game-title"><span class="t-neon">NEON</span> <span class="t-accent">ASTEROIDS</span></h1>
    <div class="title-sub">PROCEDURAL &middot; WEBGL / CANVAS 2D &middot; WEB AUDIO</div>

    <div class="settings">
      <div class="setting-group">
        <div class="setting-label">RENDERER</div>
        <div class="setting-btns" id="renderBtns">
          <button class="sbtn active" data-render="auto">AUTO</button>
          <button class="sbtn" data-render="webgl">WEBGL</button>
          <button class="sbtn" data-render="canvas">CANVAS 2D</button>
        </div>
      </div>
      <div class="setting-group">
        <div class="setting-label">DIFFICULTY</div>
        <div class="setting-btns" id="diffBtns">
          <button class="sbtn" data-diff="easy">EASY</button>
          <button class="sbtn diff active" data-diff="normal">NORMAL</button>
          <button class="sbtn diff" data-diff="hard">HARD</button>
        </div>
      </div>
    </div>

    <div class="keys">
      <b>&larr; &rarr;</b> ROTATE &nbsp; <b>&uarr;</b> THRUST &nbsp; <b>SPACE</b> FIRE &nbsp; <b>Z</b> HYPERSPACE<br>
      <b>ESC</b> / <b>P</b> PAUSE MENU &nbsp; <b>M</b> MUTE &nbsp; <b>R</b> QUIT TO MENU
    </div>
    <div class="start-prompt">PRESS ENTER TO START</div>
  </div>
  <a class="repo-link" href="https://github.com/pfelipm/neon-asteroids" target="_blank" rel="noopener">&#11088; github.com/pfelipm/neon-asteroids</a>
</div>

<div id="renderBadge"></div>
<button id="muteBtn">SOUND: ON</button>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
"use strict";
/* ============================================================
   NEON ASTEROIDS — dual renderer (WebGL Three.js / Canvas 2D)
   ============================================================ */

// ---- config ----
let renderChoice = 'auto';   // 'auto' | 'webgl' | 'canvas'
let activeRender = null;      // resolved: 'webgl' | 'canvas'
let difficulty = 'normal';    // 'easy' | 'normal' | 'hard'
const DIFF = {
  easy:   { ast:2, spd:0.7, lvs:4, ramp:0.05 },
  normal: { ast:3, spd:1.0, lvs:3, ramp:0.08 },
  hard:   { ast:4, spd:1.35, lvs:2, ramp:0.12 },
};

// ---- world ----
const WORLD_W = 1600, WORLD_H = 1000;
const WORLD = { left:-WORLD_W/2, right:WORLD_W/2, top:WORLD_H/2, bottom:-WORLD_H/2 };

// ---- state ----
const STATE = { START:'start', PLAYING:'playing', DEAD:'dead', LEVELUP:'levelup', GAMEOVER:'gameover', PAUSED:'paused' };
let state = STATE.START;
let muted = false;
let score = 0, highScore = +(localStorage.getItem('neonAsteroidsHigh')||0), level = 1, lives = 3, nextExtraLife = 10000;
let deathTimer = 0, levelUpTimer = 0, camShake = 0;
const keys = {};

// ---- game objects ----
const ship = {
  x:0,y:0, vx:0,vy:0, rot:Math.PI/2,
  rotSpeed:3.4, thrust:520, maxSpeed:460, friction:0.992,
  radius:16, thrusting:false,
  invuln:0, fireCooldown:0, alive:false,
  rapidTime:0, shieldTime:0, spreadTime:0,
};
const bullets = [];
const asteroids = [];
const powerups = [];
const ufos = [];
const enemyBullets = [];
const particles = [];
const scorePops = [];
const starData = [];
let shipTrailTimer = 0;
let ufoSpawnTimer = 18;      // seconds until next UFO
let ufoWarnEl = null, ufoWarnTimer = 0;

// ---- Three.js refs (webgl only) ----
let THREE = null;
let renderer, camera, scene, composer, bloomPass;
const shipMesh = {};

// ---- Canvas2D refs ----
let ctx2d, dpr=1, viewW=0, viewH=0, cvScale=1, camX=0, camY=0;

// ---- DOM ----
const overlayEl = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const hiscoreEl = document.getElementById('hiscore');
const livesWrap = document.getElementById('livesWrap');
const powerupWrap = document.getElementById('powerupWrap');
const muteBtn = document.getElementById('muteBtn');
const renderBadge = document.getElementById('renderBadge');
const renderBtns = document.getElementById('renderBtns');
const diffBtns = document.getElementById('diffBtns');

// ---- utils ----
function rand(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function wrap(o){
  if (o.x<WORLD.left) o.x+=WORLD_W; else if (o.x>WORLD.right) o.x-=WORLD_W;
  if (o.y<WORLD.bottom) o.y+=WORLD_H; else if (o.y>WORLD.top) o.y-=WORLD_H;
}
function circleHit(ax,ay,ar,bx,by,br){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy<=(ar+br)*(ar+br); }
function randSeeded(s,n){ const v=Math.sin(s*9999.1+n*17.3)*43758.5453; return v-Math.floor(v); }

function worldToScreen(x,y){
  if (activeRender==='webgl' && camera){
    const v=new THREE.Vector3(x,y,0).project(camera);
    return { x:(v.x*0.5+0.5)*window.innerWidth, y:(-v.y*0.5+0.5)*window.innerHeight };
  }
  return { x:(x-camX)*cvScale+viewW/2, y:(y-camY)*cvScale+viewH/2 };
}

function setRenderBadge(mode){
  renderBadge.className = mode;
  renderBadge.textContent = mode==='webgl' ? 'RENDERER: WEBGL · THREE.JS' : mode==='canvas' ? 'RENDERER: CANVAS 2D' : 'RENDERER: NONE';
}

// ============================================================
//  STARS (data only, drawn by either renderer)
// ============================================================
function buildStarData(){
  for (let i=0;i<220;i++){
    starData.push({
      x:rand(WORLD.left,WORLD.right),
      y:rand(WORLD.bottom,WORLD.top),
      s:rand(0.4,2.2),
      b:rand(0.15,0.85),
      d:Math.random(),
    });
  }
}

// ============================================================
//  MENU BACKGROUND (drifting asteroids, twinkling stars, grid)
//  Runs on its own canvas behind the overlay while on menus.
// ============================================================
const menuBg = {
  canvas:null, ctx:null, w:0, h:0, asteroids:[], stars:[], grid:[], phase:0,
  init(){
    this.canvas=document.getElementById('menuBg');
    this.ctx=this.canvas.getContext('2d');
    this.resize();
    for (let i=0;i<6;i++) this.asteroids.push(this.makeAsteroid());
    for (let i=0;i<90;i++){
      this.stars.push({ x:Math.random(), y:Math.random(), s:rand(0.4,2), tw:Math.random()*Math.PI*2, ts:rand(1,3), b:rand(0.2,0.9) });
    }
    for (let i=0;i<24;i++){
      this.grid.push({ x:Math.random(), y:Math.random(), a:Math.random()*Math.PI*2, l:rand(40,120) });
    }
  },
  resize(){
    this.w=window.innerWidth; this.h=window.innerHeight;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    this.canvas.width=Math.floor(this.w*dpr); this.canvas.height=Math.floor(this.h*dpr);
    this.canvas.style.width=this.w+'px'; this.canvas.style.height=this.h+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  makeAsteroid(){
    const n=9+Math.floor(Math.random()*4);
    const base=rand(20,70);
    const verts=[];
    for (let i=0;i<n;i++){
      const a=(i/n)*Math.PI*2, r=base*(0.7+Math.random()*0.5);
      verts.push({x:Math.cos(a)*r, y:Math.sin(a)*r});
    }
    const colors=['#cf8bff','#5ff7ff','#7dff6a','#ffe35f','#ff5fd0'];
    return {
      x:Math.random(), y:Math.random(), rot:Math.random()*Math.PI*2,
      vrot:(Math.random()-0.5)*0.5, verts,
      dx:(Math.random()-0.5)*0.006, dy:(Math.random()-0.5)*0.006,
      scale:rand(0.5,1.3), color:colors[Math.floor(Math.random()*colors.length)],
      spinDir:Math.random()>0.5?1:-1,
    };
  },
  draw(t){
    const c=this.ctx, w=this.w, h=this.h;
    c.clearRect(0,0,w,h);
    // deep gradient sky
    const g=c.createRadialGradient(w/2,h*0.4,0,w/2,h*0.5,w*0.8);
    g.addColorStop(0,'rgba(20,26,60,0.55)');
    g.addColorStop(1,'rgba(5,6,10,0.9)');
    c.fillStyle=g; c.fillRect(0,0,w,h);

    // twinkling stars
    for (const s of this.stars){
      const tw=0.5+0.5*Math.sin(s.tw + s.ts*t*0.001);
      c.globalAlpha=s.b*tw;
      c.fillStyle='#aac6ee';
      c.fillRect(s.x*w, s.y*h, s.s, s.s);
    }
    c.globalAlpha=1;

    // slow-moving grid dots (space dust)
    c.globalAlpha=0.25;
    c.fillStyle='#5ff7ff';
    for (const p of this.grid){
      const px=((p.x + t*0.00001*p.l)*100)%1; // very slow drift
      c.fillRect(px*w, p.y*h, 1.5, 1.5);
    }
    c.globalAlpha=1;

    // drifting asteroids
    for (const a of this.asteroids){
      a.x += a.dx; a.y += a.dy; a.rot += a.vrot;
      if (a.x<-0.1) a.x=1.1; if (a.x>1.1) a.x=-0.1;
      if (a.y<-0.1) a.y=1.1; if (a.y>1.1) a.y=-0.1;
      const px=a.x*w, py=a.y*h, sc=a.scale;
      c.save();
      c.translate(px,py);
      c.scale(sc,sc);
      c.rotate(a.rot);
      c.globalCompositeOperation='lighter';
      // glow stroke
      c.strokeStyle=a.color; c.lineWidth=2.5; c.shadowBlur=16; c.shadowColor=a.color;
      c.beginPath(); c.moveTo(a.verts[0].x,a.verts[0].y);
      for (let i=1;i<a.verts.length;i++) c.lineTo(a.verts[i].x,a.verts[i].y);
      c.closePath(); c.stroke();
      // fill
      c.globalCompositeOperation='source-over';
      c.shadowBlur=0;
      c.fillStyle='rgba(30,20,50,0.4)'; c.fill();
      c.restore();
    }
    c.globalCompositeOperation='source-over';
    c.globalAlpha=1;
  }
};

// ============================================================
//  ASTEROIDS (webgl mesh + canvas data)
// ============================================================
function asteroidRadius(size){ return size===3?58:size===2?34:20; }

function makeAsteroid(size, x, y, seedOverride){
  const seed = seedOverride ?? Math.floor(Math.random()*1e7);
  const n = 11 + Math.floor(randSeeded(seed,0)*4);
  const base = asteroidRadius(size);
  const verts = [];
  for (let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2, r=base*(0.68+randSeeded(seed,i+1)*0.52);
    verts.push({x:Math.cos(a)*r,y:Math.sin(a)*r});
  }
  const cracks = [];
  const numCracks = 2+Math.floor(randSeeded(seed,100)*3);
  for (let c=0;c<numCracks;c++){
    const a1=randSeeded(seed,200+c*2)*Math.PI*2, a2=a1+(randSeeded(seed,201+c*2)-0.5);
    const r1=base*0.15, r2=base*(0.35+randSeeded(seed,202+c*2)*0.45);
    cracks.push({x1:Math.cos(a1)*r1,y1:Math.sin(a1)*r1,x2:Math.cos(a2)*r2,y2:Math.sin(a2)*r2});
  }
  const ang = Math.random()*Math.PI*2;
  const speedMul = DIFF[difficulty].spd * (1+(level-1)*DIFF[difficulty].ramp);
  const szFactor = size===3?0.6:size===2?0.9:1.4;
  const speed = (28+Math.random()*30)*speedMul*szFactor;
  const ast = {
    x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
    rot:0, vrot:rand(-0.8,0.8), size, radius:base, verts, cracks,
    mesh:null,
  };

function webglCreateAsteroidMesh(ast){
  const grp = new THREE.Group();
  const pts3 = ast.verts.map(v=>new THREE.Vector3(v.x,v.y,0));
  pts3.push(pts3[0]);
  // thick glow ribbon (additive, semi-transparent) + crisp core line — matches canvas 2D look
  grp.add(thickClosedRibbon(ast.verts, 3, 0xcf8bff, 0.6, true));
  grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts3), new THREE.LineBasicMaterial({color:0xe9c6ff})));
  const shape = new THREE.Shape();
  shape.moveTo(ast.verts[0].x,ast.verts[0].y);
  for (let i=1;i<ast.verts.length;i++) shape.lineTo(ast.verts[i].x,ast.verts[i].y);
  shape.closePath();
  grp.add(new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({color:0x2a1040,transparent:true,opacity:0.4,side:THREE.DoubleSide,depthWrite:false})));
  const cv=[];
  for (const c of ast.cracks){
    cv.push(new THREE.Vector3(c.x1,c.y1,0), new THREE.Vector3(c.x2,c.y2,0));
  }
  if (cv.length) grp.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(cv), new THREE.LineBasicMaterial({color:0x7a3aa6,transparent:true,opacity:0.6})));
  grp.position.set(ast.x,ast.y,0);
  scene.add(grp);
  ast.mesh = grp;
}

// Thick OPEN polyline ribbon mesh (miter joins, flat caps).
// verts: array of {x,y}. First/last get half-thickness end caps.
function thickOpenRibbon(verts, thickness, color, opacity, additive){
  const n=verts.length;
  if (n<2) return new THREE.Mesh();
  const positions=[], indices=[];
  const t=thickness/2;
  // helper: outward normal of segment a→b (right-hand): (-dy,dx)/len
  function segNormal(ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, l=Math.hypot(dx,dy)||1; return [-dy/l, dx/l]; }
  for (let i=0;i<n;i++){
    let nx,ny;
    if (i===0){ const nn=segNormal(verts[0].x,verts[0].y,verts[1].x,verts[1].y); nx=nn[0]; ny=nn[1]; }
    else if (i===n-1){ const nn=segNormal(verts[n-2].x,verts[n-2].y,verts[n-1].x,verts[n-1].y); nx=nn[0]; ny=nn[1]; }
    else {
      const n1=segNormal(verts[i-1].x,verts[i-1].y,verts[i].x,verts[i].y);
      const n2=segNormal(verts[i].x,verts[i].y,verts[i+1].x,verts[i+1].y);
      nx=n1[0]+n2[0]; ny=n1[1]+n2[1];
      const ml=Math.hypot(nx,ny)||1; nx/=ml; ny/=ml;
      const dot=n1[0]*n2[0]+n1[1]*n2[1];
      // miter length t/cos(θ/2), clamped to avoid spikes at sharp angles
      const miterLen = Math.min(t/Math.max(0.001, Math.sqrt(Math.max(0.0001,(1+dot)/2))), t*1.3);
      nx*=miterLen; ny*=miterLen;
    }
    positions.push(verts[i].x+nx*t, verts[i].y+ny*t, 0);
    positions.push(verts[i].x-nx*t, verts[i].y-ny*t, 0);
  }
  for (let i=0;i<n-1;i++){
    const a=i*2, b=i*2+1, c=(i+1)*2, d=(i+1)*2+1;
    indices.push(a,c,b, b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  g.setIndex(indices);
  const matOpts={color,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false};
  if (additive) matOpts.blending=THREE.AdditiveBlending;
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial(matOpts));
}

// Thick closed-polygon ribbon mesh with miter joins for real neon line thickness in WebGL.
// Returns a Mesh with MeshBasicMaterial (additive when additive=true) — the "glow pass".
function thickClosedRibbon(verts, thickness, color, opacity, additive){
  const n = verts.length;
  const positions=[], indices=[];
  const t = thickness/2;
  for (let i=0;i<n;i++){
    const prev=verts[(i-1+n)%n], cur=verts[i], next=verts[(i+1)%n];
    const d1x=cur.x-prev.x, d1y=cur.y-prev.y, l1=Math.hypot(d1x,d1y)||1;
    const d2x=next.x-cur.x, d2y=next.y-cur.y, l2=Math.hypot(d2x,d2y)||1;
    const n1x=-d1y/l1, n1y=d1x/l1, n2x=-d2y/l2, n2y=d2x/l2;
    let mx=n1x+n2y, my=n1y+n2x;
    // proper miter: average the two normals
    mx=n1x+n2x; my=n1y+n2y;
    const ml=Math.hypot(mx,my)||1; mx/=ml; my/=ml;
    const dot=n1x*n2x+n1y*n2y;
    const miterLen = Math.min(t/Math.max(0.001, Math.sqrt(Math.max(0.0001,(1+dot)/2))), t*1.3);
    positions.push(cur.x+mx*miterLen, cur.y+my*miterLen, 0);
    positions.push(cur.x-mx*miterLen, cur.y-my*miterLen, 0);
  }
  for (let i=0;i<n;i++){
    const a=i*2, b=i*2+1, c=((i+1)%n)*2, d=((i+1)%n)*2+1;
    indices.push(a,c,b, b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  g.setIndex(indices);
  const matOpts = { color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false };
  if (additive) matOpts.blending = THREE.AdditiveBlending;
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial(matOpts));
}

function webglCreateShipMesh(){
  const grp = new THREE.Group();
  const pts=[new THREE.Vector3(0,16,0),new THREE.Vector3(11,-12,0),new THREE.Vector3(0,-6,0),new THREE.Vector3(-11,-12,0),new THREE.Vector3(0,16,0)];
  // open polyline thick glow + crisp core
  grp.add(thickOpenRibbon([{x:0,y:16},{x:11,y:-12},{x:0,y:-6},{x:-11,y:-12},{x:0,y:16}], 2.5, 0x5ff7ff, 0.6, true));
  grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0xeafdff})));
  const s=new THREE.Shape(); s.moveTo(0,16); s.lineTo(11,-12); s.lineTo(0,-6); s.lineTo(-11,-12); s.closePath();
  grp.add(new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({color:0x123540,transparent:true,opacity:0.35,side:THREE.DoubleSide,depthWrite:false})));
  const fs=new THREE.Shape(); fs.moveTo(-3.5,-6); fs.lineTo(0,-22); fs.lineTo(3.5,-6); fs.closePath();
  const flame=new THREE.Mesh(new THREE.ShapeGeometry(fs), new THREE.MeshBasicMaterial({color:0xff9b1f,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthWrite:false}));

}

function webglCreateBulletMesh(b){

function webglCreatePowerupMesh(p){
  const grp=new THREE.Group();
  const col = (POWERUP_DEFS[p.type]||POWERUP_DEFS.shield).color;
  const colHex = new THREE.Color(col).getHex();
  const dVerts=[{x:0,y:14},{x:12,y:0},{x:0,y:-14},{x:-12,y:0}];
  // closed diamond ribbon + crisp core
  grp.add(thickClosedRibbon(dVerts, 3, colHex, 0.6, true));
  const pts=[new THREE.Vector3(0,14,0),new THREE.Vector3(12,0,0),new THREE.Vector3(0,-14,0),new THREE.Vector3(-12,0,0),new THREE.Vector3(0,14,0)];
  grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0xffffff})));
  const sh=new THREE.Shape(); sh.moveTo(0,14); sh.lineTo(12,0); sh.lineTo(0,-14); sh.lineTo(-12,0); sh.closePath();
  grp.add(new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshBasicMaterial({color:colHex,transparent:true,opacity:0.25,side:THREE.DoubleSide,depthWrite:false})));
  grp.add(new THREE.Mesh(new THREE.CircleGeometry(3.2,6), new THREE.MeshBasicMaterial({color:colHex,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending})));
  grp.position.set(p.x,p.y,0); scene.add(grp);
  return grp;
}
function webglCreateParticleMesh(p){
  if (p.type==='line'){
    // thicker line particle mesh
    const grp=new THREE.Group();
    grp.add(thickOpenRibbon([{x:0,y:0},{x:p.size,y:0}], Math.max(1.5,p.size*0.5), new THREE.Color(p.color).getHex(), 0.8, true));
    grp.position.set(p.x,p.y,0); grp.rotation.z=p.rot; scene.add(grp); return grp;
  } else if (p.type==='ring'){
    // expanding shockwave ring
    const seg=40;
    const pts=[];
    for (let i=0;i<=seg;i++){ const a=(i/seg)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a),Math.sin(a),0)); }
    const m=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:new THREE.Color(p.color),transparent:true,opacity:1,blending:THREE.AdditiveBlending}));
    m.position.set(p.x,p.y,0); scene.add(m); return m;
  } else {
    const m=new THREE.Mesh(new THREE.PlaneGeometry(p.size,p.size), new THREE.MeshBasicMaterial({color:new THREE.Color(p.color),transparent:true,opacity:1,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.position.set(p.x,p.y,0); m.rotation.z=p.rot; scene.add(m); return m;
  }
}
function webglCreateEnemyBulletMesh(b){
  const grp=new THREE.Group();
  grp.add(thickOpenRibbon([{x:-3,y:0},{x:3,y:0}], 3.5, 0xff5fd0, 0.7, true));
  grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-2.5,0,0),new THREE.Vector3(2.5,0,0)]), new THREE.LineBasicMaterial({color:0xffd0ea})));
  grp.position.set(b.x,b.y,0); grp.rotation.z=b.rot;
  scene.add(grp); return grp;
}
function webglCreateUfoMesh(u){
  const grp=new THREE.Group();
  const col=0xff5fd0;
  // saucer body (ellipse-ish polygon) + dome + landing light
  const body=[];
  for (let i=0;i<=16;i++){ const a=(i/16)*Math.PI*2; body.push(new THREE.Vector3(Math.cos(a)*26,Math.sin(a)*8,0)); }
  grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(body), new THREE.LineBasicMaterial({color:col})));
  // dome
  const dome=[];
  for (let i=0;i<=12;i++){ const a=Math.PI+(i/12)*Math.PI; dome.push(new THREE.Vector3(Math.cos(a)*11,Math.sin(a)*11+2,0)); }
  grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(dome), new THREE.LineBasicMaterial({color:0xffffff})));
  // blinking light
  const light=new THREE.Mesh(new THREE.CircleGeometry(3,8), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending}));
  light.position.set(0,7,0);
  grp.add(light); u.light=light;
  grp.position.set(u.x,u.y,0);
  scene.add(grp); return grp;
}
function webglCreateStars(){

}

function spawnExplosion(x,y,color,count,spread){

    const a=Math.random()*Math.PI*2, sp=rand(18,spread), len=rand(3,9);
    const p={ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rand(0.7,1.5), maxLife:1, rot:a, vr:rand(-8,8), type:'line', size:len, color };
    p.maxLife=p.life;

    const p={ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rand(0.5,1.1), maxLife:1, rot:Math.random()*Math.PI*2, vr:rand(-8,8), type:'box', size:s, color };
    p.maxLife=p.life;

function fireBullet(){
  if (ship.fireCooldown>0) return;
  const rapid = ship.rapidTime>0, spread = ship.spreadTime>0;
  ship.fireCooldown = rapid?0.12:0.26;
  const nose=18;
  const sx=ship.x+Math.cos(ship.rot)*nose, sy=ship.y+Math.sin(ship.rot)*nose;
  const sp=720;
  const angles = spread ? [ship.rot-0.22, ship.rot, ship.rot+0.22] : [ship.rot];
  for (const ang of angles){
    const b={ x:sx, y:sy, vx:Math.cos(ang)*sp+ship.vx, vy:Math.sin(ang)*sp+ship.vy, life:rapid?1.4:1.1, rot:ang, mesh:null };
    if (activeRender==='webgl' && scene) b.mesh=webglCreateBulletMesh(b);
    bullets.push(b);
  }
  sndShoot();
}
function ufoFire(ufo){
  // aimed but slightly inaccurate (accuracy improves with level)
  const inacc = Math.max(0.03, 0.12 - level*0.01);
  const ang = Math.atan2(ship.y-ufo.y, ship.x-ufo.x) + (Math.random()-0.5)*inacc;
  const sp=260 + level*8;
  const b={ x:ufo.x, y:ufo.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:3.5, rot:ang, mesh:null };
  if (activeRender==='webgl' && scene) b.mesh=webglCreateEnemyBulletMesh(b);
  enemyBullets.push(b);
  sndUFoFire();
}

function startGame(){
  const d=DIFF[difficulty];
  score=0; level=1; lives=d.lvs; nextExtraLife=10000;
  ufoSpawnTimer = 18;
  clearAll(); spawnShip(); spawnLevel();
  state=STATE.PLAYING; hideOverlay(); updateHud();
  startAmbient();
}
function clearAll(){
  for (const a of asteroids) if (a.mesh) scene.remove(a.mesh);
  asteroids.length=0;
  for (const b of bullets) if (b.mesh) scene.remove(b.mesh);
  bullets.length=0;
  for (const b of enemyBullets) if (b.mesh) scene.remove(b.mesh);
  enemyBullets.length=0;
  for (const u of ufos) if (u.mesh) scene.remove(u.mesh);
  ufos.length=0;
  for (const p of powerups) if (p.mesh) scene.remove(p.mesh);
  powerups.length=0;
  for (const p of particles) if (p.mesh) scene.remove(p.mesh);
  particles.length=0;
  scorePops.forEach(s=>s.el.remove()); scorePops.length=0;
  if (ufoWarnEl){ ufoWarnEl.remove(); ufoWarnEl=null; }
  if (shipMesh.grp && scene) { scene.remove(shipMesh.grp); shipMesh.grp=null; shipMesh.flame=null; shipMesh.shield=null; }
  ship.alive=false;
}
function spawnShip(){
  ship.x=0; ship.y=0; ship.vx=0; ship.vy=0; ship.rot=Math.PI/2;
  ship.invuln=3; ship.fireCooldown=0; ship.rapidTime=0; ship.shieldTime=0; ship.spreadTime=0; ship.alive=true;
  if (activeRender==='webgl' && scene && !shipMesh.grp) webglCreateShipMesh();
  if (shipMesh.flame) shipMesh.flame.visible=false;
}
function spawnLevel(){
  const d=DIFF[difficulty];
  const count = d.ast + level;
  for (let i=0;i<count;i++){
    let x,y,tries=0;
    do {
      const e=Math.floor(Math.random()*4);
      if (e===0){ x=WORLD.left+30; y=rand(WORLD.bottom,WORLD.top); }
      else if (e===1){ x=WORLD.right-30; y=rand(WORLD.bottom,WORLD.top); }
      else if (e===2){ x=rand(WORLD.left,WORLD.right); y=WORLD.top-30; }
      else { x=rand(WORLD.left,WORLD.right); y=WORLD.bottom+30; }
      tries++;
    } while (Math.hypot(x-ship.x,y-ship.y)<280 && tries<12);
    makeAsteroid(3,x,y);
  }
  showLevelAnnouncement();
}

function spawnUFO(){
  if (ufoWarnEl){ ufoWarnEl.remove(); ufoWarnEl=null; }
  // enter from a random edge; fly across with gentle sine weave
  const side=Math.floor(Math.random()*4);
  let x,y,dx,dy;
  if (side===0){ x=WORLD.left-40; y=rand(-200,200); dx=1; dy=0; }
  else if (side===1){ x=WORLD.right+40; y=rand(-200,200); dx=-1; dy=0; }
  else if (side===2){ x=rand(-200,200); y=WORLD.top+40; dx=0; dy=-1; }
  else { x=rand(-200,200); y=WORLD.bottom-40; dx=0; dy=1; }
  const speedBase = 60 + level*6, fireBase = 1.6;
  const u={ x,y, vx:dx*speedBase, vy:dy*(40+level*4), baseVx:dx*speedBase, radius:26, rot:0, vrot:0,
    hp: Math.min(2 + Math.floor(level/2), 4), life:14, fireTimer:fireBase, phase:Math.random()*Math.PI*2, color:'#ff5fd0', mesh:null, spawnX:x, spawnY:y, dirX:dx, dirY:dy };
  if (activeRender==='webgl' && scene) u.mesh=webglCreateUfoMesh(u);
  ufos.push(u);

}
function updateUFOs(dt){
  for (let i=ufos.length-1;i>=0;i--){
    const u=ufos[i];
    u.phase+=dt*1.6;
    // weave perpendicular to travel
    u.x += u.vx*dt + Math.sin(u.phase)*22*dt;
    u.y += u.vy*dt + Math.cos(u.phase)*22*dt;
    u.rot = Math.atan2(u.vy, u.vx) + (u.dirY!==0 ? -Math.PI/2 : 0);
    u.life-=dt; u.fireTimer-=dt;
    if (u.mesh){ u.mesh.position.set(u.x,u.y,0); u.mesh.rotation.z = u.dirY!==0 ? -Math.PI/2 : u.rot; }
    if (u.light) u.light.visible = Math.sin(performance.now()*0.012)>0;
    // fire aimed shot (faster with level)
    if (u.fireTimer<=0 && ship.alive){
      u.fireTimer = Math.max(0.8, 1.6 + Math.random()*1.4 - level*0.08);
      ufoFire(u);
    }
    // despawn off-screen or timer out
    if (u.life<=0 || Math.abs(u.x)>WORLD.right+80 || Math.abs(u.y)>WORLD.top+80){
      if (u.mesh) scene.remove(u.mesh);
      ufos.splice(i,1);
    }
  }
}
function destroyUfo(u){
  addScore(300);
  spawnScorePop(u.x,u.y,'+300');
  spawnExplosion(u.x,u.y,'#ff5fd0',30,300);

  spawnFlash('rgba(255,95,208,0.35)',0.3);
  sndExplode(1.0);
  camShake = Math.max(camShake, 14);
  // always drop a power-up
  makePowerup(u.x,u.y);
  if (u.mesh) scene.remove(u.mesh);
  const idx=ufos.indexOf(u); if (idx>=0) ufos.splice(idx,1);
}
function detonateBomb(){
  spawnFlash('rgba(255,220,120,0.65)',0.5);
  sndBomb();
  camShake=40;
  // destroy every asteroid fully (no splits) with huge fx
  for (let i=asteroids.length-1;i>=0;i--){
    const a=asteroids[i];
    addScore(a.size===3?20:a.size===2?50:100);
    spawnExplosion(a.x,a.y,'#cf8bff',24,320);
    spawnShockwave(a.x,a.y,'#cf8bff');
    if (a.mesh && scene) scene.remove(a.mesh);
    asteroids.splice(i,1);
  }
  for (let i=ufos.length-1;i>=0;i--){
    const u=ufos[i];
    addScore(300);
    spawnExplosion(u.x,u.y,'#ff5fd0',26,300);
    if (u.mesh && scene) scene.remove(u.mesh);
    ufos.splice(i,1);
  }
  for (let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];
    if (b.mesh && scene) scene.remove(b.mesh);
    enemyBullets.splice(i,1);

  if (asteroids.length===0){ level++; state=STATE.LEVELUP; levelUpTimer=1.8; showLevelAnnouncement(); }
}

function killShip(){
  if (!ship.alive) return;
  setThrust(false);
  spawnExplosion(ship.x,ship.y,'#9bf6ff',70,500);
  spawnExplosion(ship.x,ship.y,'#ffffff',30,360);
  spawnShockwave(ship.x,ship.y,'#9bf6ff');

  spawnDebris(ship.x,ship.y,'#ff5fd0',26);

  if (shipMesh.grp && scene) { scene.remove(shipMesh.grp); shipMesh.grp=null; shipMesh.flame=null; shipMesh.shield=null; }
  ship.alive=false; lives--;
  sndDeathExplosion(); camShake=26;
  updateHud();
  if (lives<=0){
    state=STATE.GAMEOVER;
    if (score>highScore){ highScore=score; localStorage.setItem('neonAsteroidsHigh',String(highScore)); }

function destroyAsteroid(ast){
  const points = ast.size===3?20:ast.size===2?50:100;
  addScore(points); spawnScorePop(ast.x,ast.y,'+'+points);
  const spread = ast.size===3?280:ast.size===2?200:140;
  spawnExplosion(ast.x,ast.y,'#cf8bff',ast.size===3?34:ast.size===2?24:16,spread);
  spawnExplosion(ast.x,ast.y,'#ffffff',ast.size===3?12:8,spread*0.6);
  spawnShockwave(ast.x,ast.y,'#cf8bff');
  if (ast.size===3) spawnFlash('rgba(207,139,255,0.25)',0.2);
  sndExplode(ast.size===3?1:ast.size===2?0.7:0.5);
  camShake = Math.max(camShake, ast.size===3?14:ast.size===2?9:6);
  if (ast.size===3 && Math.random()<0.25) makePowerup(ast.x,ast.y);
  if (ast.size>1){
    const ns=ast.size-1;
    for (let i=0;i<2;i++){
      const a=makeAsteroid(ns,ast.x,ast.y);
      const ang=Math.random()*Math.PI*2, spd=rand(40,80);
      a.vx=Math.cos(ang)*spd; a.vy=Math.sin(ang)*spd;
    }
  }
  if (ast.mesh && scene) scene.remove(ast.mesh);
  const idx=asteroids.indexOf(ast); if (idx>=0) asteroids.splice(idx,1);
  if (asteroids.length===0){ level++; state=STATE.LEVELUP; levelUpTimer=1.8; showLevelAnnouncement(); }
}

async function hardRestart(){
  // tear down current renderer
  if (renderer){ try { renderer.dispose(); } catch(e){} renderer.forceContextLoss?.(); }
  if (composer){ composer=null; } renderer=null; scene=null; camera=null; THREE=null; ctx2d=null;
  // fresh canvas avoids "poisoned"/lost-context reuse
  freshCanvas();
  // clear mesh refs
  for (const a of asteroids) a.mesh=null;
  for (const b of bullets) b.mesh=null;
  for (const b of enemyBullets) b.mesh=null;
  for (const u of ufos) u.mesh=null;
  for (const p of powerups) p.mesh=null;
  for (const p of particles) p.mesh=null;
  shipMesh.grp=null; shipMesh.flame=null; shipMesh.shield=null;
  // reinit renderer per choice
  if (renderChoice !== 'canvas'){
    const ok = await tryInitWebGL();
    if (ok){ activeRender='webgl'; setRenderBadge('webgl'); }
    else { activeRender='canvas'; setRenderBadge('canvas'); initCanvas2D(); }
  } else { activeRender='canvas'; setRenderBadge('canvas'); initCanvas2D(); }
  onResize();
  // rebuild meshes for existing game objects
  if (activeRender==='webgl'){
    for (const a of asteroids) webglCreateAsteroidMesh(a);
    if (ship.alive) webglCreateShipMesh();
    for (const b of bullets) b.mesh=webglCreateBulletMesh(b);
    for (const b of enemyBullets) b.mesh=webglCreateEnemyBulletMesh(b);
    for (const u of ufos) u.mesh=webglCreateUfoMesh(u);
    for (const p of powerups) p.mesh=webglCreatePowerupMesh(p);
    for (const p of particles) p.mesh=webglCreateParticleMesh(p);
  }
  state=STATE.PLAYING; hideOverlay();
}

// ============================================================
//  AUDIO
// ============================================================
let soundCtx=null, thrustNode=null, thrustGain=null;
// master output bus: SFX → limiter → makeup gain → destination (clean boost, no clipping)
let outBus=null, sfxGain=null, ambientGainNode=null;
function ensureMasterBus(){
  if (outBus || !soundCtx) return;
  const comp=soundCtx.createDynamicsCompressor();
  comp.threshold.value=-18; comp.knee.value=10; comp.ratio.value=12;
  comp.attack.value=0.002; comp.release.value=0.2;
  // make-up gain: boost perceived loudness quite a bit; limiter catches peaks
  const make=soundCtx.createGain(); make.gain.value=2.4;
  comp.connect(make).connect(soundCtx.destination);
  const sg=soundCtx.createGain(); sg.gain.value=1.4;       // SFX level (was ~1.0 direct, now boosted)
  sg.connect(comp);
  const ag=soundCtx.createGain(); ag.gain.value=1.6;       // ambient music level (much louder)
  ag.connect(comp);
  outBus=comp; sfxGain=sg; ambientGainNode=ag;
}
function sfxOut(){ return sfxGain || soundCtx.destination; }
function ambientOut(){ return ambientGainNode || soundCtx.destination; }
function resumeAudio(){
  if (!soundCtx){ try { soundCtx=new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if (soundCtx && soundCtx.state==='suspended') soundCtx.resume();
  ensureMasterBus();
}
function createNoiseBuffer(sec){
  const len=Math.floor(soundCtx.sampleRate*sec);
  const buf=soundCtx.createBuffer(1,len,soundCtx.sampleRate);
  const d=buf.getChannelData(0); for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function sndShoot(){
  if (muted||!soundCtx) return;
  const t=soundCtx.currentTime;
  const o=soundCtx.createOscillator(), g=soundCtx.createGain();
  o.type='square'; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(180,t+0.18);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.6,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g).connect(sfxOut()); o.start(t); o.stop(t+0.22);
}
function sndExplode(scale=1){
  if (muted||!soundCtx) return;
  const t=soundCtx.currentTime, dur=0.55*scale;
  // noise crash
  const src=soundCtx.createBufferSource(); src.buffer=createNoiseBuffer(dur);
  const bp=soundCtx.createBiquadFilter(); bp.type='lowpass';
  bp.frequency.setValueAtTime(1400,t); bp.frequency.exponentialRampToValueAtTime(90,t+dur);
  const g=soundCtx.createGain(); g.gain.setValueAtTime(1.1*scale,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp).connect(g).connect(sfxOut()); src.start(t); src.stop(t+dur);
  // low thud tuned to asteroid size (big=deep, small=punchy)
  const baseFreq = scale>=1 ? 90 : scale>=0.7 ? 200 : 380;
  const o=soundCtx.createOscillator(), og=soundCtx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(baseFreq,t); o.frequency.exponentialRampToValueAtTime(baseFreq*0.3,t+dur);
  og.gain.setValueAtTime(0.9*scale,t); og.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(og).connect(sfxOut()); o.start(t); o.stop(t+dur);
}
function sndDeathExplosion(){
  if (muted||!soundCtx) return;
  const t=soundCtx.currentTime;
  // bass boom
  const o=soundCtx.createOscillator(), g=soundCtx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(28,t+0.7);
  g.gain.setValueAtTime(1.3,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.8);
  o.connect(g).connect(sfxOut()); o.start(t); o.stop(t+0.85);
  // noise crash
  const dur=0.9;
  const src=soundCtx.createBufferSource(); src.buffer=createNoiseBuffer(dur);
  const bp=soundCtx.createBiquadFilter(); bp.type='lowpass'; bp.frequency.setValueAtTime(2400,t); bp.frequency.exponentialRampToValueAtTime(50,t+dur);
  const g2=soundCtx.createGain(); g2.gain.setValueAtTime(1.6,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp).connect(g2).connect(sfxOut()); src.start(t); src.stop(t+dur);
}
function sndHyperspace(){
  if (muted||!soundCtx) return;
  const t=soundCtx.currentTime;
  const o=soundCtx.createOscillator(), g=soundCtx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(1400,t+0.35);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.05); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
  o.connect(g).connect(sfxOut()); o.start(t); o.stop(t+0.42);
}

// ============================================================
//  PROCEDURAL AMBIENT ENGINE  (Constance Demby / Novus Magnificat)
//  Layers: sub drone, beating oscillators, evolving chord pad,
//  FM bells, filter sweeps, slow LFO pulsations
// ============================================================
const ambient = {
  alive:false, nodes:[], schedId:null,
  master:null,  // master gain
  // chord pool — sets of frequencies (Hz) creating a mysterious, modal feel
  scales:[
    [55, 65.41, 73.42, 110, 130.81, 146.83, 174.61],          // D minor-ish deep
    [49, 58.27, 65.41, 98, 116.54, 130.81, 155.56],            // G dorian-ish
    [43.65, 51.91, 58.27, 87.31, 103.83, 116.54, 138.59],      // F phrygian
    [41.2, 49, 61.74, 82.41, 123.47],                          // E drone sparse
    [36.71, 43.65, 51.91, 73.42, 87.31, 110],                  // D deep wide
  ],
  curScale:0,
  chordTimer:null,
};

function buildImpulse(seconds, decay){
  // synthesize a hall-ish reverb impulse response
  const len = Math.floor(soundCtx.sampleRate*seconds);
  const buf = soundCtx.createBuffer(2, len, soundCtx.sampleRate);
  for (let c=0;c<2;c++){
    const d=buf.getChannelData(c);
    for (let i=0;i<len;i++){
      const t=i/soundCtx.sampleRate;
      d[i]=(Math.random()*2-1)*Math.pow(1-t/seconds, decay);
    }
  }
  return buf;
}

function startAmbient(){
  if (ambient.alive || !soundCtx) return;
  ambient.alive=true;
  const ctx=soundCtx;
  ambient.curScale = Math.floor(Math.random()*ambient.scales.length);

  // master gain (gentle level so SFX stay audible)
  const master = ctx.createGain();
  master.gain.value=0; // fade in
  ambient.master=master;

  // reverb send
  const verb=ctx.createConvolver();
  verb.buffer=buildImpulse(4.5, 2.0);
  const verbGain=ctx.createGain(); verbGain.gain.value=0.6;
  // dedicated mute gain AFTER master, so the breathing LFO on master.gain
  // can't bleed through when muted and unmuting always restores cleanly
  const muteGain=ctx.createGain(); muteGain.gain.value = muted ? 0 : 1;
  ambient.muteGain=muteGain;
  master.connect(muteGain).connect(ambientOut());
  master.connect(verb); verb.connect(verbGain).connect(muteGain);
  ambient.verb=verb; ambient.verbGain=verbGain;

  // ---------- sub drone ----------
  const droneGas=[], droneOscs=[];
  const droneF=[ ambient.scales[ambient.curScale][0], ambient.scales[ambient.curScale][0]*1.005 ];
  droneF.forEach((f,i)=>{
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ctx.createGain(); g.gain.value=0;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200; lp.Q.value=0.8;
    o.connect(g).connect(lp).connect(master);
    o.start(); o.gainNode=g; o.lpf=lp;
    // fade drone in over 4s
    g.gain.setTargetAtTime(0.45, ctx.currentTime, 2.0);
    droneOscs.push(o); droneGas.push(g);
    ambient.nodes.push(o);
  });
  ambient.droneOscs=droneOscs;
  ambient.droneGains=droneGas;

  // ---------- chord pad (detuned saws through sweeping lowpass) ----------
  const padGain=ctx.createGain(); padGain.gain.value=0;
  const padLP=ctx.createBiquadFilter(); padLP.type='lowpass'; padLP.frequency.value=700; padLP.Q.value=4;
  padGain.connect(padLP).connect(master);
  ambient.padLP=padLP; ambient.padGain=padGain;
  // fade pad in over 6s (slower, atmospheric entrance)
  padGain.gain.setTargetAtTime(0.3, ctx.currentTime, 3.0);

  // build 5 detuned saws; freqs refresh on chord change
  const padOscs=[];
  for (let i=0;i<6;i++){
    const o=ctx.createOscillator(); o.type='sawtooth';
    o.frequency.value=ambient.scales[ambient.curScale][i+1] || 110;
    const og=ctx.createGain(); og.gain.value=1.0/6;
    o.connect(og).connect(padGain);
    o.start(); padOscs.push({osc:o, gain:og});
    ambient.nodes.push(o);
  }
  ambient.padOscs=padOscs;

  // ---------- LFO breathing (filter sweep on pad LP + master swell) ----------
  const lfo=ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.07;
  const lfoGain=ctx.createGain(); lfoGain.gain.value=260;
  lfo.connect(lfoGain).connect(padLP.frequency);
  lfo.start(); ambient.lfo=lfo; ambient.nodes.push(lfo);
  // second slow LFO on master for menacing pulsation
  const lfo2=ctx.createOscillator(); lfo2.type='sine'; lfo2.frequency.value=0.045;
  const lfo2g=ctx.createGain(); lfo2g.gain.value=0.18;
  lfo2.connect(lfo2g).connect(master.gain);
  lfo2.start(); ambient.lfo2=lfo2; ambient.nodes.push(lfo2);

  // ---------- FM bell scheduler ----------
  ambientBell(); // first strike delayed slightly
  ambient.chordTimer=setInterval(evolveChord, 11000);

  // fade in slow
  master.gain.setTargetAtTime(0.55, ctx.currentTime, 3.0);
  console.log('%c ambient engine started','color:#9bf6ff');
}

function ambientBassPulse(){
  // rare low pulses layered on top for menace
  if (!ambient.alive || muted || !soundCtx) return;
  const ctx=soundCtx;
  const t=ctx.currentTime;
  const f = ambient.scales[ambient.curScale][0] * 0.5;
  const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f,t);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.7,t+0.6);
  g.gain.exponentialRampToValueAtTime(0.0001,t+4.5);
  o.connect(g).connect(ambient.master);
  o.start(t); o.stop(t+4.6);
}

function ambientBell(){
  if (!ambient.alive || muted || !soundCtx) return;
  const ctx=soundCtx;
  const t=ctx.currentTime;
  const sc=ambient.scales[ambient.curScale];
  const note = sc[2 + Math.floor(Math.random()*(sc.length-2))]*2; // upper octave bells
  // FM synthesis: carrier + modulator
  const car=ctx.createOscillator(); car.type='sine'; car.frequency.value=note;
  const mod=ctx.createOscillator(); mod.type='sine'; mod.frequency.value=note*2.41; // inharmonic ratio → bell-like
  const modGain=ctx.createGain(); modGain.gain.setValueAtTime(note*2.5, t);
  modGain.gain.exponentialRampToValueAtTime(1, t+3.2); // FM index decays → metallic shimmer
  mod.connect(modGain).connect(car.frequency);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.00018,t+0.02);
  g.gain.setValueAtTime(0.5,t+0.05); g.gain.exponentialRampToValueAtTime(0.0001,t+5.0);
  car.connect(g); g.connect(ambient.master); g.connect(ambient.verb);
  car.start(t); mod.start(t); car.stop(t+5.1); mod.stop(t+5.2);

  // tee up next strike with random wait
  if (ambient.alive){
    const wait = 4500 + Math.random()*8500;
    setTimeout(ambientBell, wait);
  }
}

function evolveChord(){
  if (!ambient.alive || muted || !soundCtx) return;
  const ctx=soundCtx;
  // gentle morph: tiny pitch drifts on drones, retune pad to a close neighbour scale
  ambient.curScale = (ambient.curScale+1)%ambient.scales.length;
  const sc=ambient.scales[ambient.curScale];
  ambient.padOscs.forEach((p,i)=>{
    const newF = (sc[i+1]||sc[0]) * (1+(Math.random()-0.5)*0.004);
    p.osc.frequency.setTargetAtTime(newF, ctx.currentTime, 3.0);
  });
  ambient.droneOscs.forEach((o,i)=>{
    const newF = sc[0]*(1+(i?0.005:0));
    o.frequency.setTargetAtTime(newF, ctx.currentTime, 5.0);
  });
  // occasional bass pulse + filter Q move for menace
  if (Math.random()<0.5) ambientBassPulse();
  if (ambient.padLP) ambient.padLP.Q.setTargetAtTime(2+Math.random()*8, ctx.currentTime, 4.0);
}

function stopAmbient(){
  if (!ambient.alive) return;
  ambient.alive=false;
  if (ambient.chordTimer){ clearInterval(ambient.chordTimer); ambient.chordTimer=null; }
  try {
    if (ambient.master && soundCtx){
      ambient.master.gain.setTargetAtTime(0, soundCtx.currentTime, 0.8);
    }
  } catch(e){}
  // stop oscillators after fade
  setTimeout(()=>{
    ambient.nodes.forEach(n=>{ try{ n.stop(); n.disconnect(); }catch(e){} });
    ambient.nodes=[];
  }, 2500);
  console.log('%c ambient engine stopped','color:#9bf6ff');
}

// sync ambient with mute toggle
function ambientMuteSync(){
  // if engine not running and we're unmuting during play, start it fresh
  if (!ambient.alive && !muted && soundCtx && (state===STATE.PLAYING || state===STATE.DEAD || state===STATE.LEVELUP)){
    startAmbient();
  }
  if (!ambient.muteGain || !soundCtx) return;
  const t=soundCtx.currentTime;
  if (muted){ ambient.muteGain.gain.setTargetAtTime(0, t, 0.15); }
  else { ambient.muteGain.gain.setTargetAtTime(1, t, 0.3); }
}
function ensureThrustNode(){
  if (muted||!soundCtx||thrustNode) return;
  thrustNode=soundCtx.createBufferSource(); thrustNode.buffer=createNoiseBuffer(2); thrustNode.loop=true;
  const bp=soundCtx.createBiquadFilter(); bp.type='lowpass'; bp.frequency.value=300;
  thrustGain=soundCtx.createGain(); thrustGain.gain.value=0;
  thrustNode.connect(bp).connect(thrustGain).connect(sfxOut()); thrustNode.start();
}
function setThrust(on){
  if (muted){ if (thrustGain) thrustGain.gain.value=0; return; }
  if (!soundCtx) return; ensureThrustNode();
  if (thrustGain) thrustGain.gain.setTargetAtTime(on?0.4:0, soundCtx.currentTime, 0.05);
}

// ============================================================
//  UPDATE (shared)
// ============================================================
function update(dt){
  updateShip(dt); updateBullets(dt); updateAsteroids(dt);
  updatePowerups(dt); updateUFOs(dt); updateEnemyBullets(dt);
  updateParticles(dt); updateScorePops(dt); checkCollisions();
  if (state===STATE.LEVELUP){ levelUpTimer-=dt; if (levelUpTimer<=0){ state=STATE.PLAYING; spawnLevel(); } }
  if (state===STATE.DEAD){ deathTimer-=dt; if (deathTimer<=0){ spawnShip(); state=STATE.PLAYING; } }
  if (levelAnnEl){ levelAnnTimer-=dt; if (levelAnnTimer<=0){ levelAnnEl.style.opacity='0'; const el=levelAnnEl; setTimeout(()=>el.remove(),400); levelAnnEl=null; } }
  if (ufoWarnEl){ ufoWarnTimer-=dt; if (ufoWarnTimer<=0){ ufoWarnEl.remove(); ufoWarnEl=null; } }
  if (camShake>0){ camShake-=dt*40; if (camShake<0) camShake=0; }
  // periodic UFO spawning while playing (difficulty scales with level)
  if (state===STATE.PLAYING){
    ufoSpawnTimer -= dt;
    if (ufoSpawnTimer<=0){
      const maxUfos = 1 + Math.floor((level-1)/3); // 1 → 2 at L4 → 3 at L7...
      if (ufos.length < maxUfos){
        showUfoWarning();
        setTimeout(spawnUFO, 1500);
      }
      ufoSpawnTimer = Math.max(10, 20 - level*1.2) + Math.random()*8;
    }
  }
}
function updateShip(dt){
  if (!ship.alive) return;
  // WebGL y-axis points up, Canvas y-axis points down → opposite visual rotation sign
  const rotSign = (activeRender==='webgl') ? 1 : -1;
  if (keys['ArrowLeft']) ship.rot += rotSign*ship.rotSpeed*dt;
  if (keys['ArrowRight']) ship.rot -= rotSign*ship.rotSpeed*dt;
  ship.thrusting = keys['ArrowUp']===true;
  if (ship.thrusting){
    ship.vx+=Math.cos(ship.rot)*ship.thrust*dt;
    ship.vy+=Math.sin(ship.rot)*ship.thrust*dt;
    const sp=Math.hypot(ship.vx,ship.vy);
    if (sp>ship.maxSpeed){ const k=ship.maxSpeed/sp; ship.vx*=k; ship.vy*=k; }
    // ship trail: emit a fading particle from the nozzle
    shipTrailTimer -= dt;
    if (shipTrailTimer<=0){
      shipTrailTimer = 0.02;
      const nx = ship.x - Math.cos(ship.rot)*16;
      const ny = ship.y - Math.sin(ship.rot)*16;
      const a = ship.rot + Math.PI + (Math.random()-0.5)*0.5;
      const sp2 = 30 + Math.random()*40;
      const p = { x:nx,y:ny, vx:Math.cos(a)*sp2 + ship.vx*0.3, vy:Math.sin(a)*sp2 + ship.vy*0.3,
        life:0.45, maxLife:0.45, rot:Math.random()*Math.PI*2, vr:rand(-3,3),
        type:'box', size:rand(2,4), color:'#5ff7ff' };
      if (activeRender==='webgl' && scene) p.mesh=webglCreateParticleMesh(p);
      particles.push(p);
    }
  } else { ship.vx*=ship.friction; ship.vy*=ship.friction; shipTrailTimer=0; }
  setThrust(ship.thrusting);
  if (ship.fireCooldown>0) ship.fireCooldown-=dt;
  if (keys['Space']) fireBullet();
  if (ship.invuln>0) ship.invuln-=dt;
  if (ship.rapidTime>0){ ship.rapidTime-=dt; if(ship.rapidTime<0) ship.rapidTime=0; }
  if (ship.shieldTime>0){ ship.shieldTime-=dt; if(ship.shieldTime<0) ship.shieldTime=0; }
  if (ship.spreadTime>0){ ship.spreadTime-=dt; if(ship.spreadTime<0) ship.spreadTime=0; }
  ship.x+=ship.vx*dt; ship.y+=ship.vy*dt; wrap(ship);
  // webgl sync
  if (activeRender==='webgl' && shipMesh.grp){
    shipMesh.grp.position.set(ship.x,ship.y,0);
    shipMesh.grp.rotation.z = ship.rot - Math.PI/2;
    shipMesh.grp.visible = ship.invuln>0 ? Math.sin(performance.now()*0.03)>0 : true;
    if (shipMesh.shield){
      shipMesh.shield.visible = ship.shieldTime>0;
      shipMesh.shield.material.opacity = ship.shieldTime>0 ? 0.35+0.25*Math.sin(performance.now()*0.012) : 0;
      shipMesh.shield.rotation.z = performance.now()*0.004;
    }
    if (shipMesh.flame) shipMesh.flame.visible = ship.thrusting && Math.random()>0.3;
    if (shipMesh.flame && shipMesh.flame.visible) shipMesh.flame.scale.set(1, 0.7+Math.random()*0.5, 1);
  }
  updateHud();
}
function updateBullets(dt){
  for (let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; wrap(b);
    if (b.mesh){ b.mesh.position.set(b.x,b.y,0); }
    if (b.life<=0){ if (b.mesh) scene.remove(b.mesh); bullets.splice(i,1); }
  }
}
function updateEnemyBullets(dt){
  for (let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; wrap(b);
    if (b.mesh){ b.mesh.position.set(b.x,b.y,0); }
    if (b.life<=0){ if (b.mesh) scene.remove(b.mesh); enemyBullets.splice(i,1); }
  }
}
function updateAsteroids(dt){
  for (const a of asteroids){
    a.x+=a.vx*dt; a.y+=a.vy*dt; a.rot+=a.vrot*dt; wrap(a);
    if (a.mesh){ a.mesh.position.set(a.x,a.y,0); a.mesh.rotation.z=a.rot; }
  }
}
function updatePowerups(dt){
  for (let i=powerups.length-1;i>=0;i--){
    const p=powerups[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vrot*dt; p.life-=dt; wrap(p);
    if (p.mesh){ p.mesh.position.set(p.x,p.y,0); p.mesh.rotation.z=p.rot; p.mesh.visible = p.life<1.5 ? Math.sin(performance.now()*0.02)>0 : true; }
    if (p.life<=0){ if (p.mesh) scene.remove(p.mesh); powerups.splice(i,1); }
  }
}
function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    const k=clamp(p.life/p.maxLife,0,1);
    if (p.type==='ring'){
      p.life-=dt;
      const r = p.size + (1-k)*p.grow;
      if (p.mesh){
        p.mesh.position.set(p.x,p.y,0);
        p.mesh.scale.setScalar(r);
        if (p.mesh.material) p.mesh.material.opacity=k*0.9;
        else p.mesh.traverse(o=>{ if (o.material) o.material.opacity=k*0.9; });
      }
      if (p.life<=0){ if (p.mesh) scene.remove(p.mesh); particles.splice(i,1); }
      continue;
    }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96; p.rot+=p.vr*dt; p.life-=dt;
    if (p.mesh){ p.mesh.position.set(p.x,p.y,0); p.mesh.rotation.z=p.rot;
      if (p.mesh.material){ p.mesh.material.opacity=k; }
      else { p.mesh.traverse(o=>{ if (o.material){ o.material.opacity=k; } }); }
      if (p.mesh.scale) p.mesh.scale.setScalar(0.4+k*0.8); }
    if (p.life<=0){ if (p.mesh) scene.remove(p.mesh); particles.splice(i,1); }
  }
}

// ============================================================
//  COLLISION
// ============================================================
function checkCollisions(){
  if (!ship.alive) return;
  // player bullets vs asteroids
  for (let i=asteroids.length-1;i>=0;i--){
    const a=asteroids[i];
    for (let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if (circleHit(b.x,b.y,2, a.x,a.y, a.radius*0.78)){
        if (b.mesh) scene.remove(b.mesh); bullets.splice(j,1); destroyAsteroid(a); break;
      }
    }
  }
  // player bullets vs UFOs
  for (let i=ufos.length-1;i>=0;i--){
    const u=ufos[i];
    for (let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if (circleHit(b.x,b.y,2, u.x,u.y, u.radius)){
        if (b.mesh) scene.remove(b.mesh); bullets.splice(j,1);
        u.hp--;
        if (u.hp<=0) destroyUfo(u);
        break;
      }
    }
  }
  const shieldActive = ship.shieldTime>0;
  if (ship.invuln<=0 || shieldActive){
    // ship vs asteroids
    for (let i=asteroids.length-1;i>=0;i--){
      const a=asteroids[i];
      if (circleHit(ship.x,ship.y,ship.radius, a.x,a.y, a.radius*0.78)){
        if (shieldActive){
          const dx=a.x-ship.x, dy=a.y-ship.y, len=Math.hypot(dx,dy)||1;
          a.vx=dx/len*120; a.vy=dy/len*120; ship.shieldTime=Math.min(ship.shieldTime,1);
        } else { destroyAsteroid(a); killShip(); }
        break;
      }
    }
    // ship vs UFOs
    for (let i=ufos.length-1;i>=0;i--){
      const u=ufos[i];
      if (circleHit(ship.x,ship.y,ship.radius+4, u.x,u.y, u.radius)){
        if (shieldActive){ u.vx=-u.vx; u.vy=-u.vy; ship.shieldTime=Math.min(ship.shieldTime,1); }
        else { destroyUfo(u); killShip(); }
        break;
      }
    }
    // ship vs enemy bullets
    for (let i=enemyBullets.length-1;i>=0;i--){
      const b=enemyBullets[i];
      if (circleHit(ship.x,ship.y,ship.radius, b.x,b.y,3)){
        if (b.mesh) scene.remove(b.mesh); enemyBullets.splice(i,1);
        if (shieldActive){ ship.shieldTime=Math.min(ship.shieldTime,1); }
        else { killShip(); }
      }
    }
  }
  // ship vs powerups
  for (let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];
    if (circleHit(ship.x,ship.y,ship.radius, p.x,p.y,p.radius)){
      const def=POWERUP_DEFS[p.type]||POWERUP_DEFS.shield;
      if (p.type==='shield'){ ship.shieldTime=8; }
      else if (p.type==='rapid'){ ship.rapidTime=8; }
      else if (p.type==='spread'){ ship.spreadTime=8; }
      else if (p.type==='bomb'){ detonateBomb(); }
      spawnDebris(p.x,p.y, def.color, 8);
      sndPowerup(); if (p.mesh) scene.remove(p.mesh); powerups.splice(i,1); updateHud();
    }
  }
}

// ============================================================
//  RENDER — CANVAS 2D
// ============================================================
function renderCanvas2D(){
  const c=document.getElementById('game');
  // ensure canvas size
  if (c.width !== Math.floor(viewW*dpr) || c.height !== Math.floor(viewH*dpr)){
    c.width=Math.floor(viewW*dpr); c.height=Math.floor(viewH*dpr);
    c.style.width=viewW+'px'; c.style.height=viewH+'px';
  }
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
  ctx2d.fillStyle='#05060a'; ctx2d.fillRect(0,0,viewW,viewH);

  let shx=0,shy=0,srot=0;
  if (camShake>0){ const s=camShake; shx=(Math.random()-0.5)*s*0.5; shy=(Math.random()-0.5)*s*0.5; srot=(Math.random()-0.5)*s*0.002; }
  ctx2d.translate(viewW/2+shx, viewH/2+shy);
  if (srot) ctx2d.rotate(srot);
  ctx2d.scale(cvScale,cvScale);
  ctx2d.translate(-camX,-camY);

  // world border
  ctx2d.save(); ctx2d.globalCompositeOperation='lighter';
  ctx2d.strokeStyle='rgba(95,247,255,0.05)'; ctx2d.lineWidth=2; ctx2d.shadowBlur=20; ctx2d.shadowColor='rgba(95,247,255,0.3)';
  ctx2d.strokeRect(WORLD.left,WORLD.bottom,WORLD_W,WORLD_H);
  ctx2d.restore();

  // stars
  ctx2d.save(); ctx2d.globalCompositeOperation='lighter';
  for (const s of starData){
    ctx2d.fillStyle='rgba(150,180,220,'+s.b+')';
    ctx2d.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx2d.restore();

  // particles
  ctx2d.save(); ctx2d.globalCompositeOperation='lighter';
  for (const p of particles){
    const k=clamp(p.life/p.maxLife,0,1);
    ctx2d.globalAlpha=k; ctx2d.strokeStyle=p.color; ctx2d.fillStyle=p.color;
    ctx2d.shadowBlur=12; ctx2d.shadowColor=p.color;
    ctx2d.save(); ctx2d.translate(p.x,p.y); ctx2d.rotate(p.rot);
    if (p.type==='line'){ ctx2d.beginPath(); ctx2d.moveTo(0,0); ctx2d.lineTo(p.size,0); ctx2d.stroke(); }
    else if (p.type==='ring'){
      const r = p.size + (1-k)*p.grow;
      ctx2d.beginPath(); ctx2d.arc(0,0,r,0,Math.PI*2); ctx2d.stroke();
    }
    else { ctx2d.fillRect(-p.size/2,-p.size/2,p.size,p.size); }
    ctx2d.restore();
  }
  ctx2d.globalAlpha=1; ctx2d.restore();

  // asteroids
  for (const a of asteroids){
    ctx2d.save(); ctx2d.translate(a.x,a.y); ctx2d.rotate(a.rot);
    ctx2d.globalCompositeOperation='lighter';
    ctx2d.strokeStyle='#cf8bff'; ctx2d.lineWidth=4; ctx2d.shadowBlur=22; ctx2d.shadowColor='#cf8bff';
    ctx2d.beginPath(); ctx2d.moveTo(a.verts[0].x,a.verts[0].y);
    for (let i=1;i<a.verts.length;i++) ctx2d.lineTo(a.verts[i].x,a.verts[i].y);
    ctx2d.closePath(); ctx2d.stroke();
    ctx2d.lineWidth=1.6; ctx2d.strokeStyle='#e9c6ff'; ctx2d.shadowBlur=0; ctx2d.stroke();
    ctx2d.globalCompositeOperation='source-over'; ctx2d.fillStyle='rgba(42,16,64,0.4)'; ctx2d.fill();
    // cracks
    ctx2d.globalCompositeOperation='lighter'; ctx2d.strokeStyle='#7a3aa6'; ctx2d.lineWidth=1; ctx2d.shadowBlur=8; ctx2d.shadowColor='#7a3aa6'; ctx2d.globalAlpha=0.6;
    ctx2d.beginPath();
    for (const c of a.cracks){ ctx2d.moveTo(c.x1,c.y1); ctx2d.lineTo(c.x2,c.y2); }
    ctx2d.stroke(); ctx2d.globalAlpha=1; ctx2d.restore();
  }

  // powerups
  for (const p of powerups){
    if (p.life<1.5 && Math.sin(performance.now()*0.02)<=0) continue;
    ctx2d.save(); ctx2d.translate(p.x,p.y); ctx2d.rotate(p.rot);
    ctx2d.globalCompositeOperation='lighter';
    ctx2d.strokeStyle=p.color; ctx2d.lineWidth=4; ctx2d.shadowBlur=26; ctx2d.shadowColor=p.color;
    ctx2d.beginPath(); ctx2d.moveTo(p.verts[0].x,p.verts[0].y);
    for (let i=1;i<p.verts.length;i++) ctx2d.lineTo(p.verts[i].x,p.verts[i].y);
    ctx2d.closePath(); ctx2d.stroke();
    ctx2d.lineWidth=1.6; ctx2d.strokeStyle='#ffffff'; ctx2d.shadowBlur=0; ctx2d.stroke();
    ctx2d.globalCompositeOperation='source-over'; ctx2d.fillStyle='rgba(0,0,0,0.3)'; ctx2d.fill();
    ctx2d.globalCompositeOperation='lighter'; ctx2d.fillStyle=p.color; ctx2d.shadowBlur=14; ctx2d.shadowColor=p.color;
    ctx2d.beginPath(); ctx2d.arc(0,0,3.2,0,Math.PI*2); ctx2d.fill();
    ctx2d.restore();
  }

  // bullets
  ctx2d.save(); ctx2d.globalCompositeOperation='lighter';
  ctx2d.strokeStyle='#ffffff'; ctx2d.shadowColor='#9bf6ff'; ctx2d.shadowBlur=14; ctx2d.lineWidth=2; ctx2d.lineCap='round';
  for (const b of bullets){
    const ang=Math.atan2(b.vy,b.vx);
    ctx2d.save(); ctx2d.translate(b.x,b.y); ctx2d.rotate(ang);
    ctx2d.beginPath(); ctx2d.moveTo(-3,0); ctx2d.lineTo(3,0); ctx2d.stroke();
    ctx2d.restore();
  }
  ctx2d.restore();

  // enemy bullets (magenta streaks)
  ctx2d.save(); ctx2d.globalCompositeOperation='lighter';
  ctx2d.strokeStyle='#ffd0ea'; ctx2d.shadowColor='#ff5fd0'; ctx2d.shadowBlur=16; ctx2d.lineWidth=3; ctx2d.lineCap='round';
  for (const b of enemyBullets){
    const ang=Math.atan2(b.vy,b.vx);
    ctx2d.save(); ctx2d.translate(b.x,b.y); ctx2d.rotate(ang);
    ctx2d.beginPath(); ctx2d.moveTo(-4,0); ctx2d.lineTo(4,0); ctx2d.stroke();
    ctx2d.restore();
  }
  ctx2d.restore();

  // UFOs
  for (const u of ufos){
    ctx2d.save(); ctx2d.translate(u.x,u.y);
    // rotate toward travel direction
    ctx2d.rotate(Math.atan2(u.vy,u.vx));
    ctx2d.globalCompositeOperation='lighter';
    // saucer body (ellipse)
    ctx2d.strokeStyle=u.color; ctx2d.lineWidth=3; ctx2d.shadowBlur=20; ctx2d.shadowColor=u.color;
    ctx2d.beginPath(); ctx2d.ellipse(0,0,26,8,0,0,Math.PI*2); ctx2d.stroke();
    // dome
    ctx2d.strokeStyle='#ffffff'; ctx2d.lineWidth=2; ctx2d.shadowBlur=14; ctx2d.shadowColor='#ffffff';
    ctx2d.beginPath(); ctx2d.arc(0,0,11,Math.PI,0); ctx2d.stroke();
    // blinking light
    if (Math.sin(performance.now()*0.01)>0){
      ctx2d.fillStyle='#ffffff'; ctx2d.shadowBlur=14; ctx2d.shadowColor='#ffffff';
      ctx2d.beginPath(); ctx2d.arc(0,4,2.5,0,Math.PI*2); ctx2d.fill();
    }
    ctx2d.restore();
  }

  // ship
  if (ship.alive){
    const blink = ship.invuln>0 ? Math.sin(performance.now()*0.03)>0 : true;
    if (blink){
      ctx2d.save(); ctx2d.translate(ship.x,ship.y); ctx2d.rotate(ship.rot - Math.PI/2);
      // flame
      if (ship.thrusting){
        const fl=10+Math.random()*8;
        ctx2d.save(); ctx2d.globalCompositeOperation='lighter';
        ctx2d.strokeStyle='#ff9b1f'; ctx2d.shadowColor='#ff9b1f'; ctx2d.shadowBlur=18; ctx2d.lineWidth=3; ctx2d.lineCap='round';
        ctx2d.beginPath(); ctx2d.moveTo(-3.5,-6); ctx2d.lineTo(0,-6-fl); ctx2d.lineTo(3.5,-6); ctx2d.closePath();
        ctx2d.stroke(); ctx2d.fillStyle='rgba(255,180,60,0.4)'; ctx2d.fill();
        ctx2d.restore();
      }
      // hull
      ctx2d.globalCompositeOperation='lighter';
      ctx2d.strokeStyle='#5ff7ff'; ctx2d.lineWidth=4; ctx2d.shadowBlur=20; ctx2d.shadowColor='#5ff7ff';
      ctx2d.beginPath(); ctx2d.moveTo(0,16); ctx2d.lineTo(11,-12); ctx2d.lineTo(0,-6); ctx2d.lineTo(-11,-12); ctx2d.closePath();
      ctx2d.stroke();
      ctx2d.lineWidth=1.6; ctx2d.strokeStyle='#eafdff'; ctx2d.shadowBlur=0; ctx2d.stroke();
      ctx2d.globalCompositeOperation='source-over'; ctx2d.fillStyle='rgba(18,53,64,0.35)'; ctx2d.fill();
      // shield
      if (ship.shieldTime>0){
        ctx2d.save(); ctx2d.globalCompositeOperation='lighter';
        ctx2d.strokeStyle='#5ff7ff'; ctx2d.lineWidth=2; ctx2d.shadowBlur=22; ctx2d.shadowColor='#5ff7ff';
        ctx2d.globalAlpha=0.35+0.25*Math.sin(performance.now()*0.012);
        ctx2d.beginPath(); ctx2d.arc(0,0,28,0,Math.PI*2); ctx2d.stroke();
        ctx2d.restore();
      }
      ctx2d.restore();
    }
  }
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
}

// ============================================================
//  RENDER — WEBGL
// ============================================================
function renderWebGL(){
  if (camShake>0){
    const s=camShake;
    camera.position.x=(Math.random()-0.5)*s*0.5; camera.position.y=(Math.random()-0.5)*s*0.5;
    camera.rotation.z=(Math.random()-0.5)*s*0.0006;
  } else { camera.position.x=0; camera.position.y=0; camera.rotation.z=0; }
  composer.render();
}

// ============================================================
//  RENDER DISPATCH
// ============================================================
function renderFrame(){
  if (activeRender==='webgl') renderWebGL();
  else renderCanvas2D();
}

// ============================================================
//  RESIZE
// ============================================================
function onResize(){
  viewW=window.innerWidth; viewH=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  if (activeRender==='webgl' && renderer){
    renderer.setSize(viewW,viewH); composer.setSize(viewW,viewH);
    const wa=WORLD_W/WORLD_H, sa=viewW/viewH;
    let vw,vh;
    if (sa>wa){ vh=WORLD_H; vw=WORLD_H*sa; } else { vw=WORLD_W; vh=WORLD_W/sa; }
    camera.left=-vw/2; camera.right=vw/2; camera.top=vh/2; camera.bottom=-vh/2;
    camera.updateProjectionMatrix();
  } else if (activeRender==='canvas'){
    const wa=WORLD_W/WORLD_H, sa=viewW/viewH;
    if (sa>wa) cvScale=viewH/WORLD_H; else cvScale=viewW/WORLD_W;
  }
}

// ============================================================
//  WEBGL INIT
// ============================================================
async function tryInitWebGL(){
  try {
    THREE = await import('three');
    const ec = await import('three/addons/postprocessing/EffectComposer.js');
    const rp = await import('three/addons/postprocessing/RenderPass.js');
    const ub = await import('three/addons/postprocessing/UnrealBloomPass.js');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05060a);
    const canvas = document.getElementById('game');
    // try multiple attr sets
    for (const opts of [{canvas,antialias:true,powerPreference:'high-performance'},{canvas,antialias:false},{canvas}]){
      try { renderer = new THREE.WebGLRenderer(opts); break; } catch(e){ renderer=null; }
    }
    if (!renderer) throw new Error('WebGL context creation failed');
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera = new THREE.OrthographicCamera(-WORLD_W/2,WORLD_W/2,WORLD_H/2,-WORLD_H/2,-1000,1000);
    camera.position.z=500;
    composer = new ec.EffectComposer(renderer);
    composer.addPass(new rp.RenderPass(scene,camera));
    bloomPass = new ub.UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),1.45,0.55,0.12);
    composer.addPass(bloomPass);
    webglCreateStars();
    return true;
  } catch(e){
    console.warn('WebGL init failed:', e);
    THREE=null; renderer=null; scene=null; camera=null; composer=null;
    return false;
  }
}

function freshCanvas(){
  const old=document.getElementById('game');
  const fresh=document.createElement('canvas');
  fresh.id='game'; fresh.style.cssText='position:fixed;inset:0;display:block;';
  if (old) old.replaceWith(fresh);
  return fresh;
}

function initCanvas2D(){
  // fresh canvas to avoid context conflicts
  ctx2d=freshCanvas().getContext('2d');
  onResize();
}

// ============================================================
//  INIT + START
// ============================================================
async function initAndStart(){
  if (renderChoice !== 'canvas'){
    const ok = await tryInitWebGL();
    if (ok){
      activeRender='webgl'; setRenderBadge('webgl');
      console.log('%cNEON ASTEROIDS — WebGL (Three.js + Bloom)','color:#5ff7ff');
      onResize();
      window.addEventListener('resize', onResize);
      startGame();
      return;
    }
    // fall through to canvas
  }
  activeRender='canvas'; setRenderBadge('canvas');
  console.log('%cNEON ASTEROIDS — Canvas 2D','color:#ffe35f');
  initCanvas2D();
  window.addEventListener('resize', onResize);
  startGame();
}

// ============================================================
//  LOOP
// ============================================================
function menuLoop(now){
  requestAnimationFrame(menuLoop);
  if (state===STATE.START || state===STATE.GAMEOVER){
    menuBg.draw(now);
  } else {
    menuBg.ctx.clearRect(0,0,menuBg.w,menuBg.h);
  }
}
function loop(){
  requestAnimationFrame(loop);
  if (!activeRender) return;
  const now=performance.now();
  const dt=Math.min((now-loop.last)/1000, 1/30);
  loop.last=now;
  if (state===STATE.PLAYING || state===STATE.DEAD || state===STATE.LEVELUP) update(dt);
  renderFrame();
}
loop.last = performance.now();

// ============================================================
//  BOOT
// ============================================================
buildStarData();
menuBg.init();
showWelcome();
updateHud();
bindSettings();
requestAnimationFrame(loop);
requestAnimationFrame(menuLoop);
</script>
